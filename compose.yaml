services:
  db_hot:
    image: postgres:16-alpine
    container_name: ib-read-model-db-hot
    environment:
      POSTGRES_DB: ibdb_hot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ib_read_model_db_hot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibdb_hot"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_warm:
    image: postgres:16-alpine
    container_name: ib-read-model-db-warm
    environment:
      POSTGRES_DB: ibdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - ib_read_model_db_warm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: ib-read-model-app
    depends_on:
      db_hot:
        condition: service_healthy
      db_warm:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      IB_READ_MODEL_HOT_DATABASE_URL: ${IB_READ_MODEL_HOT_DATABASE_URL:-postgresql://postgres:postgres@db_hot:5432/ibdb_hot}
      IB_READ_MODEL_WARM_DATABASE_URL: ${IB_READ_MODEL_WARM_DATABASE_URL:-postgresql://postgres:postgres@db_warm:5432/ibdb}
      IB_READ_MODEL_PRICE_INDEXER_BASE_URL: ${IB_READ_MODEL_PRICE_INDEXER_BASE_URL:-http://iron-burrow-price-indexer:3010}
      PRICE_QL_INTERNAL_TOKEN: ${PRICE_QL_INTERNAL_TOKEN:-}
    command: ["migrate-all"]

  worker:
    build:
      context: .
    container_name: ib-read-model-worker
    profiles:
      - worker
    depends_on:
      db_hot:
        condition: service_healthy
      db_warm:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      IB_READ_MODEL_HOT_DATABASE_URL: ${IB_READ_MODEL_HOT_DATABASE_URL:-postgresql://postgres:postgres@db_hot:5432/ibdb_hot}
      IB_READ_MODEL_WARM_DATABASE_URL: ${IB_READ_MODEL_WARM_DATABASE_URL:-postgresql://postgres:postgres@db_warm:5432/ibdb}
      IB_READ_MODEL_PRICE_INDEXER_BASE_URL: ${IB_READ_MODEL_PRICE_INDEXER_BASE_URL:-http://iron-burrow-price-indexer:3010}
      PRICE_QL_INTERNAL_TOKEN: ${PRICE_QL_INTERNAL_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        uv run --no-dev ib-read-model migrate-all &&
        while true; do
          uv run --no-dev ib-read-model refresh-all-prices;
          sleep "$${IB_READ_MODEL_REFRESH_INTERVAL_SECONDS:-300}";
        done

volumes:
  ib_read_model_db_hot:
  ib_read_model_db_warm:
