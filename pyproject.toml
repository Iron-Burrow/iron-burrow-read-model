[project]
name = "iron-burrow-read-model"
version = "0.1.0"
description = "Read-optimized derived tables for Iron Burrow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.2.1",
    "typer>=0.12.3",
]

[project.scripts]
ib-read-model = "ib_read_model.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ib_read_model"]
